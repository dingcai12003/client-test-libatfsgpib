# ATFS GPIB shared library path.
# By default run.sh sources atfs-env.sh and provides GPIB_LIBRARY_PATH.
# To override explicitly, uncomment and set:
# library_path=/custom/ATFS/i386/linux/ATFSsys-4.05F1/lib/libatfsgpib.so

# dlopen binding mode: lazy or now.
# now is the default strict mode after ATFS dependencies are available.
library_bind_mode=now

# Optional ATFS dependency libraries to preload before library_path.
# Separate multiple paths with commas. Leave empty when no preload is needed.
preload_libraries=

# Device name from the ATFS gpib.conf [device] section.
# Current field setup: PH1 0 1 TMO=5
device_name=PH1

# Payload receive buffer size for ms and send --read-payload.
read_buffer_size=2048

# WaitSrq diagnostic timeout in microseconds.
# 5000000 us = 5 seconds, matching the current PH1 TMO=5 field setup.
wait_srq_timeout_us=5000000

# Enable ATFS resource manager lock/unlock around UTSC_Gpib_Open/Close.
# Default is disabled for command-format diagnostics; set to 1 to match ATFS samples.
use_rm_lock=0
